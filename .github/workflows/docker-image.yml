name: 'Docker 镜像构建'
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'          # 打 v0.1.0 等标签时自动构建并产出镜像
permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: '构建 Docker 镜像'
      run: |
        docker build -f python_ascend/Dockerfile -t npu-runntime python_ascend
    - name: '导出并上传镜像工件'
      run: |
        docker save npu-runntime | gzip > npu-runntime-image.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: 'npu-runntime-docker-image-${{ github.ref_name }}'
        path: 'npu-runntime-image.tar.gz'
        if-no-files-found: 'warn'
        retention-days: 14
